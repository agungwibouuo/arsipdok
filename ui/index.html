<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArsipDok — Pencatatan Dokumentasi Foto &amp; Video</title>
    <script>
      // Tangkap error awal agar layar putih tidak tanpa penjelasan
      window.__arsipdokErrors = [];
      function showFatal(title, detail) {
        window.__arsipdokErrors.push({ title, detail });
        var el = document.getElementById('app');
        if (!el) return;
        el.innerHTML =
          '<div style="font-family:Segoe UI,Inter,sans-serif;padding:32px;color:#0F172A">' +
          '<h2 style="margin:0 0 8px;color:#DC2626">' + title + '</h2>' +
          '<pre style="white-space:pre-wrap;background:#FEF2F2;border:1px solid #FCA5A5;border-radius:8px;padding:12px;font-size:12px;color:#7F1D1D">' +
          String(detail).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) +
          '</pre></div>';
      }
      window.addEventListener('error', function (e) {
        showFatal('Gagal memuat antarmuka', (e.error && e.error.stack) || e.message || e);
      });
      window.addEventListener('unhandledrejection', function (e) {
        showFatal('Janji JavaScript ditolak', (e.reason && e.reason.stack) || e.reason);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
